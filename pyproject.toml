[project]
name = "opportunity-operator"
version = "0.0.1"
description = "Bounded agent that finds, verifies, ranks, prepares and tracks funding/credit opportunities."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
opop = "opportunity_operator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E701", "E702", "B011", "B017"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/opportunity_operator/policy", "src/opportunity_operator/store", "src/opportunity_operator/safe_fs.py", "src/opportunity_operator/text.py"]
plugins = ["pydantic.mypy"]
